<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker — Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }

    /* Step indicator connector line */
    .step-connector { flex: 1; height: 2px; }

    /* Fade transition between steps */
    .step-card {
      animation: fadeIn 0.25s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Terminal output */
    #terminal {
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 1.1rem; height: 1.1rem;
      border: 2px solid rgba(99,102,241,0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Custom scrollbar for terminal */
    #terminal-wrap::-webkit-scrollbar { width: 6px; }
    #terminal-wrap::-webkit-scrollbar-track { background: #1e1e2e; }
    #terminal-wrap::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">

  <!-- Step progress bar -->
  <div id="progress-bar" class="fixed top-0 left-0 right-0 bg-white border-b border-gray-200 px-6 py-3 hidden z-10">
    <div id="step-indicators" class="max-w-2xl mx-auto flex items-center gap-1 text-xs"></div>
  </div>

  <!-- Main card -->
  <div id="card" class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-100 mt-10">
    <div id="content" class="p-8"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
